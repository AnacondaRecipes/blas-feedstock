anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: Reference-LAPACK/lapack
      use_max_tag: true
      include_regex: ^v\d+\.\d+\.\d+$
      from_pattern: ^v(.+)$
      to_pattern: \1
    packages:
      - blas
      - blas-devel
      - libblas
      - libcblas
      - liblapack
      - liblapacke
